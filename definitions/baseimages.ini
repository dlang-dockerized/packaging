; Base-image definitions - dlang-dockerized
;
; License: CC0-1.0
;
; Explanation:
;   [name]
;   image = <Container image in <repo>:<tag> format>
;   env[<Key>] = <Value of environment variable>
;
;	[name]
;	alias = <Name of the definition that this one is an alias for>
;
; The special name "default" refers to the base-image definition
; that is used automatically when none has been provided by the user.

; default image
[default]
alias = trixie

; regular definitions

;; Debian

;;; Debian 13
[trixie]
image = docker.io/debian:trixie-slim
env[DISTRO] = debian
env[LLVM_10_PATCH] = llvm-10-trixie.patch

;;; Debian 12
[bookworm]
image = docker.io/debian:bookworm-slim
env[DISTRO] = debian

;; Ubuntu

;;; Ubuntu 26.04
[resolute]
image = docker.io/ubuntu:resolute
env[DISTRO] = debian

;;; Ubuntu 24.04
[noble]
image = docker.io/ubuntu:noble
env[DISTRO] = debian

;;; Ubuntu 22.04
[jammy]
image = docker.io/ubuntu:jammy
env[DISTRO] = debian
